services:
  app1:
    image: <dockerhub-username>/comments-app:latest
    container_name: comments-app1
    environment:
      - APP_NAME=App1
    ports:
      - "3001:3000"
    restart: unless-stopped
    networks:
      - comments-net

  app2:
    image: <dockerhub-username>/comments-app:latest
    container_name: comments-app2
    environment:
      - APP_NAME=App2
    ports:
      - "3002:3000"
    restart: unless-stopped
    networks:
      - comments-net

  app3:
    image: <dockerhub-username>/comments-app:latest
    container_name: comments-app3
    environment:
      - APP_NAME=App3
    ports:
      - "3003:3000"
    restart: unless-stopped
    networks:
      - comments-net

networks:
  comments-net:
    driver: bridge